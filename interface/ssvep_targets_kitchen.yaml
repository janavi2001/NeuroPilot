# Six-target SSVEP layout for the GR00T LIBERO-Goal kitchen (Step 5).
# Frequencies, channels, threshold and early-stopping rule are identical to
# ssvep_targets_6.yaml (chosen on BETA S11-S20), so its held-out statistics apply;
# only the object names change. Each object maps to an exact LIBERO-Goal task
# instruction, the language the official GR00T-N1.7-LIBERO libero_goal checkpoint
# was post-trained on.
window_seconds: 2.0
harmonics: 3
channels: [O1, Oz, O2, PO3, PO4, PO7, PO8, POz]
margin_threshold: 0.075
cancel_target: CANCEL
targets:
  BOWL: 8.6
  PLATE: 9.8
  CHEESE: 11.0
  WINE: 12.2
  STOVE: 14.0
  CANCEL: 15.8
early_stop:
  min_seconds: 0.3
  base_margin: 0.17
  exponent: 0.5
results:
  eval: artifacts/results/step4f_ssvep_eval.json
  early_stop: artifacts/results/step4f_early_stop_eval.json
tasks:
  BOWL: put the bowl on the stove
  PLATE: push the plate to the front of the stove
  CHEESE: put the cream cheese in the bowl
  WINE: put the wine bottle on the rack
  STOVE: turn on the stove
